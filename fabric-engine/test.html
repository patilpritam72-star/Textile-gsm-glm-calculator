<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textile Engine Test</title>
</head>
<body>

<h2>Textile Calculation Engine Test</h2>

<button onclick="runTest()">Run Test</button>

<pre id="result"></pre>

<script src="./engine.js"></script>

<script>
function runTest() {

  const tests = [
    ["Ne", 40, 14.7625],
    ["Tex", 20, 20],
    ["Denier", 150, 16.6667],
    ["Nm", 40, 25]
  ];

  let output = "";

  tests.forEach(test => {
    const result = TextileEngine.toTex(
      test[1],
      test[0]
    );

    const passed =
      Math.abs(result - test[2]) < 0.001;

    output +=
      test[0] + " " + test[1] +
      " = " + result.toFixed(4) +
      " Tex : " +
      (passed ? "PASS" : "CHECK") +
      "\n";
  });

  document.getElementById("result").textContent = output;
}
</script>

</body>
</html>
