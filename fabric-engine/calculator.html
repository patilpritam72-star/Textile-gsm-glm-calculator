
<!DOCTYPE html>
<html lang="en">
  
<style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabric Construction Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
  color: #1e293b;
}

h2 {
  text-align: center;
  color: #0f4c81;
}

h3 {
  color: #0f4c81;
  border-bottom: 1px solid #cbd5e1;
  padding-bottom: 8px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 16px;
  box-sizing: border-box;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

label {
  font-weight: bold;
}

button {
  width: 100%;
  padding: 14px;
  background: #0f4c81;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  padding: 16px;
  background: white;
  border-radius: 10px;
  line-height: 2;
}
</style>
</head>
</style>
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabric Construction Calculator</title>
</head>
<body>

<h2>Fabric Construction Calculator</h2>

<h3>Warp Details</h3>

<label>Warp Count:</label>
<input id="warpCount" type="number" value="40">

<label>Warp System:</label>
<select id="warpSystem">
  <option value="Ne">Ne</option>
  <option value="Tex">Tex</option>
  <option value="Denier">Denier</option>
  <option value="Nm">Nm</option>
</select>

<h3>Weft Details</h3>

<label>Weft Count:</label>
<input id="weftCount" type="number" value="40">

<label>Weft System:</label>
<select id="weftSystem">
  <option value="Ne">Ne</option>
  <option value="Tex">Tex</option>
  <option value="Denier">Denier</option>
  <option value="Nm">Nm</option>
</select>

<h3>Fabric Details</h3>

<label>EPI:</label>
<input id="epi" type="number" value="80">

<label>PPI:</label>
<input id="ppi" type="number" value="60">

<label>Warp Crimp (%):</label>
<input id="warpCrimp" type="number" value="5">

<label>Weft Crimp (%):</label>
<input id="weftCrimp" type="number" value="5">

<label>Finished Width (Inches):</label>
<input id="widthInch" type="number" value="60">

<br><br>

<button onclick="calculateFabric()">Calculate</button>

<div id="result"></div>

<script src="./engine.js"></script>
  
<script>
function calculateFabric() {

  const data = {
    warpCount: Number(document.getElementById("warpCount").value),
    warpSystem: document.getElementById("warpSystem").value,

    weftCount: Number(document.getElementById("weftCount").value),
    weftSystem: document.getElementById("weftSystem").value,

    epi: Number(document.getElementById("epi").value),
    ppi: Number(document.getElementById("ppi").value),

    warpCrimp: Number(document.getElementById("warpCrimp").value),
    weftCrimp: Number(document.getElementById("weftCrimp").value),

    widthInch: Number(document.getElementById("widthInch").value)
  };

if (
  data.warpCount <= 0 ||
  data.weftCount <= 0 ||
  data.epi <= 0 ||
  data.ppi <= 0 ||
  data.widthInch <= 0 ||
  data.warpCrimp < 0 ||
  data.weftCrimp < 0
) {
  document.getElementById("result").textContent =
    "Error: Please enter valid positive values. Crimp cannot be negative.";

  return;
}
  
  const result = TextileEngine.calculate(data);

  
document.getElementById("result").innerHTML = `
  <h3>Calculation Result</h3>

  <div style="
    background: white;
    padding: 18px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 5px solid #16a34a;
  ">
    <small>EXPECTED GSM</small>
    <h2>${result.totalGSM.toFixed(2)}</h2>
    <p>Grams / Square Meter</p>
  </div>

  <div style="
    background: white;
    padding: 18px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 5px solid #2563eb;
  ">
    <small>EXPECTED GLM</small>
    <h2>${result.glm.toFixed(2)}</h2>
    <p>Grams / Linear Meter</p>
  </div>
`;
